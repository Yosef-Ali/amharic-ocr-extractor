name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life in April 2026. 24 is the current LTS and
          # is what @renovatebot/pep440 asks for (^20.9.0 || ^22.11.0 || ^24).
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Fails if a VITE_-prefixed secret was inlined into the shipped JS.
      - run: npm run check:secrets

      - run: npm test
